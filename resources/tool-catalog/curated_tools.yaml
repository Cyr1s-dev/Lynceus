tools:
  - id: semgrep
    name: Semgrep
    domain: web_sast
    description: Static application security scanner for source-code patterns.
    upstream_url: https://github.com/semgrep/semgrep
    executable_names: ["semgrep", "semgrep.exe"]
    version_args: ["--version"]
    supported_platforms: ["linux", "darwin", "windows"]
    output_format: json
    adapter_status: implemented
    risk_notes:
      - Rule matches require evidence review before confirmed vulnerability claims.
    install:
      method: pip
      package: semgrep==1.172.0
      version: 1.172.0
    invocation:
      params:
        - key: config
          kind: string
          flag: "--config"
          default: auto
          required: false
          description: Semgrep ruleset id or local rule path (default "auto").
        - key: include
          kind: string_list
          flag: "--include"
          description: Glob patterns restricting scanned files.
        - key: exclude
          kind: string_list
          flag: "--exclude"
          description: Glob patterns skipping scanned files.
        - key: timeout_seconds
          kind: integer
          default: 120
          minimum: 1
          description: Wall-clock cap for the scan in seconds.
      env_keys:
        - name: SEMGREP_APP_TOKEN
          description: Semgrep App token unlocking pro registries (optional).
  - id: nuclei
    name: Nuclei
    domain: web_dast
    description: Template-based DAST scanner for web and network services.
    upstream_url: https://github.com/projectdiscovery/nuclei
    executable_names: ["nuclei", "nuclei.exe"]
    version_args: ["-version"]
    supported_platforms: ["linux", "darwin", "windows"]
    output_format: jsonl
    adapter_status: implemented
    risk_notes:
      - Template execution must be scoped and rate-limited.
    install:
      method: github_release
      repository: projectdiscovery/nuclei
      release_tag: v3.11.1
      asset_patterns:
        windows_amd64: "^nuclei_.*_windows_amd64\\.zip$"
        linux_amd64: "^nuclei_.*_linux_amd64\\.zip$"
        linux_arm64: "^nuclei_.*_linux_arm64\\.zip$"
        darwin_amd64: "^nuclei_.*_macOS_amd64\\.zip$"
        darwin_arm64: "^nuclei_.*_macOS_arm64\\.zip$"
      sha256_by_platform:
        windows_amd64: "bb6cb9ff8939b753f6fcab06fd30a15f5bc61d8382a597871334c007a85ff9d2"
        linux_amd64: "ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6"
        linux_arm64: "8044e3d9768ba0a744b2872c1a87e813006f013da97ca9f50f7661a4203bec07"
        darwin_amd64: "75c47ce11e9dbd4288a1c895ed85e3c4df9f4acb8237d6d178da6dccd1628f2a"
        darwin_arm64: "7d7e291addd1fc29a9bf8d089afe878a9799b20229cbea2fb1693fc40fd4c5f0"
    target_flag: ["-u"]
    invocation:
      params:
        - key: templates
          kind: string_list
          flag: "-templates"
          description: Template directories or single template files to run.
        - key: severity
          kind: string_list
          flag: "-severity"
          description: Severities to include (info, low, medium, high, critical).
        - key: tags
          kind: string_list
          flag: "-tags"
          description: Execute only templates tagged with these tags.
        - key: exclude_tags
          kind: string_list
          flag: "-exclude-tags"
          description: Skip templates tagged with these tags.
        - key: rate_limit
          kind: integer
          flag: "-rate-limit"
          minimum: 1
          description: Maximum requests per second.
        - key: retries
          kind: integer
          flag: "-retries"
          minimum: 0
          description: Number of times to retry a failed request.
        - key: headless
          kind: boolean
          flag: "-headless"
          description: Enable headless browser based template execution.
        - key: timeout_seconds
          kind: integer
          default: 300
          minimum: 1
          description: Wall-clock cap for the scan in seconds.
  - id: subfinder
    name: Subfinder
    domain: asset_recon
    description: Passive subdomain discovery tool for asset reconnaissance.
    upstream_url: https://github.com/projectdiscovery/subfinder
    executable_names: ["subfinder", "subfinder.exe"]
    version_args: ["-version"]
    supported_platforms: ["linux", "darwin", "windows"]
    output_format: jsonl
    adapter_status: implemented
    risk_notes:
      - Passive recon results require reachability validation.
    install:
      method: github_release
      repository: projectdiscovery/subfinder
      release_tag: v2.15.0
      asset_patterns:
        windows_amd64: "^subfinder_.*_windows_amd64\\.zip$"
        linux_amd64: "^subfinder_.*_linux_amd64\\.zip$"
        linux_arm64: "^subfinder_.*_linux_arm64\\.zip$"
        darwin_amd64: "^subfinder_.*_macOS_amd64\\.zip$"
        darwin_arm64: "^subfinder_.*_macOS_arm64\\.zip$"
      sha256_by_platform:
        windows_amd64: "37fca8541b4cb9e2a9b542a94defd671a9fd2f6003b2cc64c38d20c736b28be4"
        linux_amd64: "ce7372c58f25facbbb036c821a6336df2b4017891257f1455cd8d00d704d5862"
        linux_arm64: "73a5fe3ee55205e8bf6fee57c7af29048f664c0d2b2f69d592b6b5c22bfc1f5a"
        darwin_amd64: "c9f51b0adfa77fd7f0452b7cec7cb0ac71aa6e745920a829d7b5498cb942786c"
        darwin_arm64: "92e003a9b3628377b9a05536de58146d3e1af56494ae9f0761449d3e19d54337"
    target_flag: ["-d"]
    output_flags: ["-json", "-o", "-"]
    invocation:
      params:
        - key: provider_config
          kind: path
          flag: "-provider-config"
          description: >-
            Path to a subfinder provider-config.yaml; reference injected env
            keys with $VAR_NAME placeholders (e.g. shodan: [$SHODAN_API_KEY]).
      env_keys:
        - name: SHODAN_API_KEY
          description: Shodan passive source API key.
        - name: CHAOS_API_KEY
          description: ProjectDiscovery Chaos passive source API key.
        - name: VIRUSTOTAL_API_KEY
          description: VirusTotal passive source API key.
        - name: SECURITYTRAILS_API_KEY
          description: SecurityTrails passive source API key.
        - name: CENSYS_API_ID
          description: Censys API ID (pair with CENSYS_API_SECRET).
        - name: CENSYS_API_SECRET
          description: Censys API secret (pair with CENSYS_API_ID).
        - name: GITHUB_TOKEN
          description: GitHub token for the github passive source.
        - name: FOFA_EMAIL
          description: Fofa account email (pair with FOFA_KEY).
        - name: FOFA_KEY
          description: Fofa API key (pair with FOFA_EMAIL).
        - name: HUNTER_API_KEY
          description: Hunter (Qianxin) passive source API key.
        - name: QUAKE_TOKEN
          description: 360 Quake passive source API token.
        - name: ZOOMEYE_API_KEY
          description: ZoomEye passive source API key.
  - id: naabu
    name: Naabu
