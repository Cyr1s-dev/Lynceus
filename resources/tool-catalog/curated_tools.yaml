      sha256_by_platform:
        windows_amd64: "4efaa341f36a0c6e676164f75e2d93d5a72f4090d690fd1bc293f5a4b79c202b"
        linux_amd64: "018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90"
        linux_arm64: "3adc2bb2395c3efff89623499b20eea66ef54924c485d3ae86762393a31736ea"
